<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facts</title>
    <link rel="icon" href="./assets/Logo.jpg" type="image/icon jpg">
    <!-- <link rel="stylesheet" href="./universe.css"> -->
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Verdana', sans-serif;
    background: radial-gradient(circle at center, #0d1b2a, #1b263b, #415a77, #1b263b);
    color: #ffffff;
    overflow-y: auto; 
}

.background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -1; 
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: starAnimation 10s linear infinite;
}

.content {
    position: relative;
    z-index: 1; 
    padding: 20px;
}

a {
    color: #ffcc00;
    text-decoration: none;
    font-size: 1.5rem;
    position: relative;
    background: rgba(255, 204, 0, 0.2);
    padding: 10px;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00;
    transition: transform 0.3s ease;
    animation: glow 1.5s ease-in-out infinite;
}

a:hover {
    transform: scale(1.2);
}

h1 {
    margin: 20px 0;
    text-align: center;
    font-size: 2.5rem;
    text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffffff;
    color: #ffcc00;
}

nav {
    display: flex;
    justify-content: space-evenly;
    gap: 15px;
    margin: -10px 0 50px; 
}

.Universe {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
}

.image-container {
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid #ffcc00;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 10px #ffcc00, 0 0 30px #ffffff;
    text-align: center;
    transition: transform 0.5s ease-in-out, box-shadow 0.5s ease-in-out;
}

.image-container:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px #ffcc00, 0 0 40px #ffffff;
}

.section-title {
    margin: 0;
    padding: 15px 10px;
    font-size: 1.5rem;
    background: linear-gradient(to right, #ffcc00, #ffffff);
    color: #000;
    font-weight: bold;
}

.image-container img {
    width: 100%;
    height: auto;
    border-bottom: 2px solid #ffcc00;
}

.image-container p {
    padding: 10px;
    font-size: 1rem;
    color: #ffffff;
    line-height: 1.6;
    text-align: justify;
}

@keyframes glow {
    0%, 100% {
        box-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00;
    }
    50% {
        box-shadow: 0 0 20px #ffcc00, 0 0 40px #ffcc00;
    }
}

@keyframes starAnimation {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(100vh);
    }
}

@media (max-width: 768px) {
    nav {
        flex-wrap: wrap;
        gap: 10px;
    }

    section {
        max-width: 90%;
    }

    header h1 {
        font-size: 2rem;
    }

    header p {
        font-size: 1rem;
    }

    nav a {
        font-size: 1rem;
        padding: 8px 10px;
    }
}
    </style>
</head>
<body>
    <!-- Starfield container -->
    <div class="background"></div>

    <div class="content">
        <div class="nav-container">
            <a href="../index.html">🏠</a>
            <nav>
                <a href="#">The Universe</a>
                <a href="../planets/planets.html">Planets</a>
                <a href="../facts/facts.html">Facts</a>
                <a href="../gallery/gallery.html">Gallery</a>
                <a href="../contact us form/contact.html">Contact us</a>
            </nav>
        </div>
        <h1>Facts About Universe</h1>
        <div class="Universe">
            <!-- Initial loading message -->
            <p style="grid-column: 1 / -1; text-align: center; padding: 50px;">
                Connecting to local server...
            </p>
        </div>
    </div>

    <script type="module">
        const FACTS_API_URL = 'http://127.0.0.1:8000/universe';
        const factsContainer = document.querySelector('.Universe');

        /**
         * Renders a single fact card onto the UI.
         * @param {object} fact - An object containing fact data (e.g., { name, img, fact }).
         */
        function renderFactCard(item) {
            const imgContainer = document.createElement("div");
            imgContainer.classList.add("image-container");

            const title = document.createElement("h2");
            title.classList.add("section-title");
            title.textContent = item.name || 'Untitled Cosmic Object';

            const img = document.createElement("img");
            // Mapping your JSON keys: 'img' -> src
            const imageUrl = item.img;
            img.src = imageUrl || 'https://placehold.co/320x220/415a77/ffcc00?text=Image+Missing';
            img.alt = item.name || 'Cosmic Image';

            // Fallback for missing or broken images
            img.onerror = () => {
                img.src = `https://placehold.co/320x220/415a77/ffcc00?text=Image+for+${encodeURIComponent(item.name || 'Fact')}...`;
                console.error(`Failed to load image for: ${item.name}`);
            };

            const caption = document.createElement("p");
            // Mapping your JSON keys: 'fact' -> content
            caption.textContent = item.fact || 'No detailed explanation provided by the API.';

            imgContainer.appendChild(title);
            imgContainer.appendChild(img);
            imgContainer.appendChild(caption);
            factsContainer.appendChild(imgContainer);
        }

        /**
         * Fetches data from the specified API endpoint.
         */
        async function fetchUniverseFacts() {
            try {
                const response = await fetch(FACTS_API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}. Check if your local server is running.`);
                }
                const data = await response.json();

                // Crucial step: Accessing the array inside the 'universe' property
                const factsArray = data.universe;

                // Clear loading message
                factsContainer.innerHTML = '';

                if (Array.isArray(factsArray) && factsArray.length > 0) {
                    factsArray.forEach(renderFactCard);
                } else {
                    factsContainer.innerHTML = `
                        <p style="grid-column: 1 / -1; text-align: center; padding: 50px; color: #ffcc00;">
                            Server returned successfully, but the 'universe' array was empty or invalid.
                        </p>`;
                }

            } catch (error) {
                console.error('Fetch error:', error);
                factsContainer.innerHTML = `
                    <p style="grid-column: 1 / -1; text-align: center; padding: 50px; color: #ff6666; border: 1px solid #ff6666; border-radius: 10px; margin: 20px;">
                        ⚠️ **Failed to load facts.**<br>Error: ${error.message}<br>Please verify your server is running at **${FACTS_API_URL}** and returning the correct JSON structure.
                    </p>`;
            }
        }

        /**
         * Creates the animated star background.
         * @param {number} count - The number of stars to create.
         */
        function createStars(count) {
            const background = document.querySelector('.background');
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                // Randomize initial position across the viewport
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;

                // Randomize size
                star.style.width = `${Math.random() * 2 + 1}px`;
                star.style.height = star.style.width;

                // Randomize duration and use a negative delay for staggered start
                const duration = Math.random() * 15 + 10; // 10s to 25s
                const delay = Math.random() * -15; // Start mid-animation

                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--delay', `${delay}s`);

                background.appendChild(star);
            }
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Start the API fetch
            fetchUniverseFacts();

            // 2. Initialize the star field
            createStars(150);
        });
    </script>
</body>

</html>
